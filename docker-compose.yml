services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniqms
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: omniqms
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
    restart: unless-stopped
volumes:
  pgdata:
